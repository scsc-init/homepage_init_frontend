name: Issue type label

# Applies 'new feature' or 'enhancement' based on the "Type" dropdown
# in the Feature / Enhancement issue template.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const typeToLabel = {
              'New feature': 'new feature',
              'Enhancement': 'enhancement',
            };
            const match = (context.payload.issue.body || '').match(/^### Type\s*\n+\s*(.+?)\s*$/m);
            const wanted = match && typeToLabel[match[1]];
            if (!wanted) return;

            const issue = { ...context.repo, issue_number: context.payload.issue.number };
            const current = context.payload.issue.labels.map((l) => l.name);

            for (const label of Object.values(typeToLabel)) {
              if (label !== wanted && current.includes(label)) {
                await github.rest.issues.removeLabel({ ...issue, name: label });
              }
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ ...issue, labels: [wanted] });
            }
