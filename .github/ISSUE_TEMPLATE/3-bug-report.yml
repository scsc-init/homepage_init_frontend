name: '🐛 Bug Report'
description: 'Report a problem or unexpected behavior'
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: 'What went wrong?'
      description: 'What happened, and what did you expect instead?'
      placeholder: 'ex. Clicking "Save" on my profile shows an error instead of saving.'
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 'Target Area'
      description: 'Where does the issue occur? (page URL / API endpoint / file component)'
      placeholder: 'ex. src/app/board/[id]/page.tsx (/board/1)'
  - type: textarea
    id: steps
    attributes:
      label: 'Steps to reproduce'
      description: 'Skip if it is obvious from above.'
      placeholder: |
        1. Log in
        2. Go to ...
        3. Click ...
  - type: textarea
    id: evidence
    attributes:
      label: 'Screenshots / logs'
      description: 'Drag and drop images or paste error messages.'
  - type: input
    id: related
    attributes:
      label: 'Related issues / PRs'
      placeholder: 'ex. #123, scsc-init/homepage_init_backend#45'
