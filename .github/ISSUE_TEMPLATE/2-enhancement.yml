name: '⚡ Enhancement'
description: 'Improvement to an existing feature'
labels: ['enhancement']
body:
  - type: textarea
    id: what
    attributes:
      label: 'What should be improved?'
      placeholder: 'ex. Show the author name next to each comment instead of the user ID.'
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 'Target Area'
      description: 'Which files need to change? (or the page URL / API endpoint)'
      placeholder: 'ex. src/app/board/[id]/page.tsx (/board/1)'
  - type: textarea
    id: done
    attributes:
      label: 'Goals'
      description: 'Proposed complete state of changes'
  - type: input
    id: related
    attributes:
      label: 'Related issues / PRs'
      placeholder: 'ex. #123, scsc-init/homepage_init_backend#45'
