name: '✨ Feature / Enhancement'
description: 'Request a new feature or an improvement to an existing one'
body:
  - type: dropdown
    id: type
    attributes:
      label: 'Type'
      description: 'The matching label is applied automatically'
      options:
        - New feature
        - Enhancement
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 'What should change?'
      placeholder: 'ex. Let users search board posts by author name.'
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 'Where?'
      description: 'Which files need to change? (or the page URL / API endpoint)'
      placeholder: 'ex. src/app/board/[id]/page.tsx (/board/1)'
  - type: textarea
    id: done
    attributes:
      label: 'Goal'
      description: 'Complete state of changes'
      value: |
        - [ ]
  - type: input
    id: related
    attributes:
      label: 'Related issues / PRs'
      placeholder: 'ex. #123, scsc-init/homepage_init_backend#45'
